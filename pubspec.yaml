name: routewise
description: Routewise - delivery route planner for Lagos riders (Flutter port of the Figma Make design).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  app_links: ^7.2.2
  flutter:
    sdk: flutter
  flutter_map: ^7.0.2
  geolocator: ^13.0.2
  google_fonts: ^6.2.1
  http: ^1.6.0
  latlong2: ^0.9.1
  path_drawing: ^1.0.1
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^9.2.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
